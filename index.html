    <link rel="icon" href="icon.svg" type="image/svg+xml" />

  </head>
  <body>
    <header class="top">
      <button id="backBtn" class="icon-btn" aria-label="Назад" hidden>‹</button>
      <div class="title" id="title">ПСГИ</div>
      <button
        id="netBtn"
        class="net"
        title="Нажмите, чтобы показать работу без интернета"
      ></button>
    </header>
    <main id="app">
      <p id="refreshStatus" class="meta" role="status">Загрузка…</p>
      <div id="launchSplash" class="app-loading" role="status" hidden>
        <div class="loading-art"><img src="psgi-splash-reference.png" alt="ПСГИ. Система подготовки и контроля работ электромонтёров" width="412" height="955"></div>
        <div class="loading-status"><progress aria-label="Загрузка приложения"></progress><span>Загрузка…</span></div>
      </div>
    </main>
    <script>
      {
        const navigation = performance.getEntriesByType('navigation')[0];
        let newLaunch = navigation ? navigation.type === 'navigate' : performance.navigation?.type === 0;
        try {
          if (sessionStorage.getItem('psgiOpened')) newLaunch = false;
          sessionStorage.setItem('psgiOpened', '1');
        } catch {}
        if (newLaunch) {
          document.getElementById('launchSplash').hidden = false;
          document.getElementById('refreshStatus').hidden = true;
        }
      }
    </script>
    <div id="toast" class="toast" role="status"></div>
